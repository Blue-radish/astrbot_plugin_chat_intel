name: astrbot_plugin_chat_intel
display_name: 群聊情报
short_desc: 多群群聊情报：话题整理成长图，静默私聊给你；生成过的报告可以回头讨论、按证据回查原话
desc: >-
  多群群聊情报：从多个群里拉消息并实时留存图片，按每个群各自配置的标签（关心的标签 / 不要的标签）把记录切成一张张话题卡，写清时间、参与人和完整经过，配图跟着话题卡走；不符合标签的闲聊、灌水、表情一律不进报告。
  用本地 Typst 排版成一张长图，落盘到插件数据目录，永不发回群里；到点私聊推给你，或者在私聊里用大白话说一句「群聊情报今天群里聊了啥」。
  每份报告还会存一份结构化 JSON：话题正文和来源消息引用都在里面（不抄原文，要原话按引用去消息库取），所以报告发出去之后还能接着讨论（「第二个话题怎么回事」「他原话怎么说的」「后来有人验证了吗」），不用重新生成一遍。报告与原文同寿，都保留 keep_days 天。
version: 2.2.26
author: Ray
repo: https://github.com/Blue-radish/astrbot_plugin_chat_intel
