name: astrbot_plugin_chat_intel
display_name: 群聊情报
short_desc: 多群群聊情报：每个群一份自己的兴趣，按兴趣总结，本地排版成图，静默私聊给你
desc: >-
  多群群聊情报：从多个群里拉消息并实时留存图片，按每个群各自配置的兴趣（想要的主题 /
  不要的主题）抽取条目，外加一行透明度统计和今日金句；不符合兴趣的闲聊、灌水、表情一律不进报告。
  用本地 Typst 排版成一张长图，落盘到插件数据目录，永不发回群里；到点私聊推给你，也可用命令按日期生成。
version: 1.2.2
author: Ray
repo: https://github.com/Blue-radish/astrbot_plugin_chat_intel
